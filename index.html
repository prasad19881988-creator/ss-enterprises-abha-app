<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS ENTERPRISES • ABHA App</title><script src="/socket.io/socket.io.js"></script><style>:root{--g:#28b95b;--n:#122033;--b:#2563eb;--bg:#f5f7fb;--muted:#667085;--bd:#e4e7ec}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:var(--bg);color:#182230}.top{height:64px;background:linear-gradient(90deg,#1fb253,#52c96f);color:#fff;display:flex;align-items:center;padding:8px 16px;gap:12px;position:sticky;top:0;z-index:10}.brand{font-weight:800;flex:1}.wrap{max-width:1200px;margin:auto;padding:18px}.login{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:20px}.box,.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 8px 30px #1018280c}.box{width:min(500px,100%)}h1,h2,h3{margin-top:0}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--b);color:#fff}.green{background:var(--g);color:#fff}.outline{background:#fff;border:1px solid var(--bd)}.danger{background:#fff1f0;color:#b42318}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{font-size:27px;font-weight:900}.muted{color:var(--muted);font-size:13px}.section{margin-top:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.hidden{display:none!important}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:10px;border-bottom:1px solid var(--bd);font-size:13px;text-align:left}.badge{padding:4px 8px;border-radius:99px;background:#ecfdf3;color:#027a48;font-size:11px;font-weight:800}.off{background:#f2f4f7;color:#475467}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}}</style></head><body><header class="top"><div class="brand">SS ENTERPRISES • ABHA WORK PORTAL</div><button id="logoutBtn" class="outline hidden" onclick="logout()">Logout</button></header><section id="loginView" class="login"><div class="box"><h1>SS ENTERPRISES</h1><p class="muted">ABHA Project Management System</p><div class="tabs"><button id="loginTab" class="primary" onclick="showLogin()">Login</button><button id="signupTab" class="outline" onclick="showSignup()">New Staff Sign Up</button></div><div id="loginForm"><label>Login type</label><select id="role" onchange="syncId()"><option value="employee">Employee</option><option value="owner">Owner / Admin</option></select><label>Employee ID / Admin ID</label><input id="uid" value="EMP101"><label>Password</label><input id="pwd" type="password" value="SS@12345"><button class="primary" style="width:100%;margin-top:16px" onclick="login()">Secure Login</button></div><div id="signupForm" class="hidden"><label>Full Name</label><input id="sn" placeholder="Staff name"><label>Mobile Number</label><input id="sp" placeholder="Mobile number" inputmode="tel"><label>Area / Location</label><input id="sa" placeholder="e.g. Darbhanga"><p class="muted">Employee ID automatically बनेगा. सभी employees का password <b>SS@12345</b> रहेगा.</p><button class="green" style="width:100%" onclick="signup()">Create Staff Account</button></div></div></section><main id="app" class="wrap hidden"></main><script>
const officialABHA="https://abha.abdm.gov.in/";
let socket=io(),session=null,watchId=null,map=null;let state=null;socket.on('state',d=>{state=d;if(session?.role==='owner')renderOwner(d)});function showLogin(){loginForm.classList.remove('hidden');signupForm.classList.add('hidden')}function showSignup(){loginForm.classList.add('hidden');signupForm.classList.remove('hidden')}function syncId(){if(role.value==='owner'){uid.value='SS';pwd.value='ADMIN@12345'}else{uid.value='EMP101';pwd.value='SS@12345'}}function login(){socket.emit('login',{role:role.value,id:uid.value.trim(),password:pwd.value},r=>{if(!r.ok)return alert(r.message);session={role:role.value,id:uid.value.trim(),token:r.token};loginView.classList.add('hidden');logoutBtn.classList.remove('hidden');if(session.role==='owner')renderOwner(r.state);else renderEmployee(r.employee)})}function signup(){socket.emit('signup',{name:sn.value,phone:sp.value,area:sa.value},r=>{if(!r.ok)return alert(r.message);alert('Account created!\nEmployee ID: '+r.employee.id+'\nPassword: SS@12345');showLogin();role.value='employee';uid.value=r.employee.id;pwd.value='SS@12345'})}function logout(){stopLocation();socket.emit('logout',{token:session?.token});session=null;app.classList.add('hidden');loginView.classList.remove('hidden');logoutBtn.classList.add('hidden')}function renderOwner(s){app.classList.remove('hidden');let es=s.employees||[],cs=s.customers||[];app.innerHTML=`<h2>Owner Dashboard</h2><div class="grid"><div class="card"><div class="muted">Total Staff</div><div class="metric">${es.length}</div></div><div class="card"><div class="muted">Online</div><div class="metric">${es.filter(e=>e.status==='Online').length}</div></div><div class="card"><div class="muted">Customers</div><div class="metric">${cs.length}</div></div><div class="card"><div class="muted">Completed ABHA Work</div><div class="metric">${cs.filter(c=>c.status==='Completed').length}</div></div></div><div class="card section"><h3>Employees</h3><div class="tablewrap"><table class="table"><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Status</th><th>Area</th><th>Cards</th><th>Last</th></tr>${es.map(e=>`<tr><td>${e.id}</td><td>${e.name}</td><td>${e.phone||'—'}</td><td><span class="badge ${e.status!=='Online'?'off':''}">${e.status}</span></td><td>${e.area||'—'}</td><td>${e.cards||0}</td><td>${e.last||'—'}</td></tr>`).join('')}</table></div></div><div class="card section"><h3>Customer / ABHA Work Records</h3><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Employee</th><th>Customer</th><th>Mobile</th><th>ABHA Card No.</th><th>Area</th><th>Status</th><th>Remarks</th><th>Action</th></tr>${cs.map(c=>`<tr><td>${c.date}</td><td>${c.employeeName} (${c.employeeId})</td><td>${c.name}</td><td>${c.mobile||'—'}</td><td>${c.abha||'—'}</td><td>${c.area||'—'}</td><td>${c.status}</td><td>${c.remarks||'—'}</td><td><button class="danger" onclick="deleteCustomer('${c.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`}function deleteCustomer(id){if(confirm('Delete this record?'))socket.emit('deleteCustomer',{token:session.token,id},r=>{if(!r.ok)alert(r.message)})}function renderEmployee(e){app.classList.remove('hidden');let mine=(state?.customers||[]).filter(c=>c.employeeId===e.id);app.innerHTML=`<div class="card"><h2>Hello, ${e.name}</h2><p class="muted">Employee ID: <b>${e.id}</b> • Password: SS@12345</p><div class="card section" style="background:#f8fafc"><h3>ABHA App Portal</h3><p class="muted">Customer ka authorised ABHA work official ABDM portal par complete karein. Kaam complete hone ke baad neeche customer details save karein.</p><button class="primary" onclick="window.open(officialABHA,'_blank')">Open ABHA App Portal</button></div><div class="actions"><button class="green" onclick="startWork()">Start Work & Live Location</button><button class="danger" onclick="closeWork()">Close Work</button></div><p>Status: <b id="st">${e.status}</b> • ${e.location||'Not sharing'}</p></div><div class="card section"><h3>Add Customer / ABHA Work</h3><div class="two"><div><label>Customer Name *</label><input id="cn"></div><div><label>Mobile Number</label><input id="cm" inputmode="tel"></div></div><div class="two"><div><label>ABHA Card Number</label><input id="ca" placeholder="Enter authorised ABHA number"></div><div><label>Area / Work Location</label><input id="crarea" value="${e.area||''}"></div></div><div class="two"><div><label>Work Status</label><select id="cs"><option>Completed</option><option>Pending</option></select></div><div><label>Remarks</label><input id="cr" placeholder="Work details"></div></div><button class="primary" style="margin-top:14px" onclick="addCustomer()">Save Customer Work</button></div><div class="card section"><h3>My Customer Records (${mine.length})</h3><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Mobile</th><th>ABHA Card No.</th><th>Area</th><th>Status</th><th>Remarks</th></tr>${mine.map(c=>`<tr><td>${c.date}</td><td>${c.name}</td><td>${c.mobile||'—'}</td><td>${c.abha||'—'}</td><td>${c.area||'—'}</td><td>${c.status}</td><td>${c.remarks||'—'}</td></tr>`).join('')}</table></div></div>`}function addCustomer(){socket.emit('addCustomer',{token:session.token,name:cn.value,mobile:cm.value,abha:ca.value,area:crarea.value,status:cs.value,remarks:cr.value},r=>{if(!r.ok)return alert(r.message);alert('Customer work saved.');renderEmployee(r.employee)})}function startWork(){if(!navigator.geolocation)return alert('Location is not supported.');socket.emit('startWork',{token:session.token},r=>{if(!r.ok)return alert(r.message);navigator.geolocation.getCurrentPosition(sendLocation,()=>alert('Location permission is required.'),{enableHighAccuracy:true,timeout:15000});watchId=navigator.geolocation.watchPosition(sendLocation,()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});renderEmployee(r.employee)})}function sendLocation(p){if(session)socket.emit('locationUpdate',{token:session.token,lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy})}function stopLocation(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}function closeWork(){stopLocation();socket.emit('closeWork',{token:session.token},r=>{if(r.ok)renderEmployee(r.employee)})}
</script></body></html>
